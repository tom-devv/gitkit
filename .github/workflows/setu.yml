name: Markdown Checker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Setu CLI
        id: cache-setu
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/setu-cli
          key: ${{ runner.os }}-setu-cli

      - name: Install Setu
        if: steps.cache-setu.outputs.cache-hit != 'true'
        run: cargo install setu-cli

      - name: Run Setu in strict mode
        run: setu-cli --strict .
