[package]
name = "gitkit-cli"
version = "0.1.4"
edition = "2024"
description = "Get insightful metrics on your git repository"
license = "MIT"
readme = "README.md"
authors = ["tom-devv"]
repository = "https://github.com/tom-devv/gitkit"


[package.metadata.release]
push = false
pre-release-commit-message = "Release {{version}}"

[[bin]]
name = "gitkit"
path = "src/main.rs"



[dependencies]
chrono = "0.4.44"
git2 = "0.21.0"
ratatui = "0.30.0"
tui-input = { version = "0.15.3", features = ["crossterm"], default-features = false }
thiserror = "2"
crossterm = "0.29.0"
clap = { version = "4.6.1", features = ["derive"] }
rayon = "1.12.0"


[dev-dependencies]
divan = "0.1"

[[bench]]
name = "git_benches"
harness = false

[profile.release]
debug = true
codegen-units = 1
lto = true
opt-level = "s"
strip = true

