[package]
name = "gitkit"
version = "0.1.0"
edition = "2024"
description = "Get insightful metrics on your git repository"
license = "MIT"
readme = "README.md"
authors = ["tom-devv"]
repository = "https://github.com/tom-devv/gitkit"

[dependencies]
chrono = "0.4.44"
git2 = "0.21.0"
ratatui = "0.30.0"
thiserror = "2"
crossterm = "0.29.0"
clap = { version = "4.6.1", features = ["derive"] }


[dev-dependencies]
divan = "0.1"

[[bench]]
name = "git_benches"
harness = false

[profile.release]
debug = true
codegen-units = 1
lto = true
opt-level = "s"
strip = true

